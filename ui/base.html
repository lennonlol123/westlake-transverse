<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Westlake TransVerse</title>
  <style>/* Base game face. Every colour comes from the look's palette (--w-*), every text
 * face from the look's type (--world-*); world-themes.css adds each frame's
 * construction on top. Nothing here depends on game state. */
:root{--w-bg:#080808;--w-panel:#141414;--w-ink:#eee9d9;--w-muted:#a7a29a;--w-accent:#b52332;--w-accent2:#e8cb72;--w-edge:#841722;--w-sky:#202650;--w-ground:#78532e;--w-far:#364f97;--w-near:#18244d;
--world-font:'AGIIPixel','Courier New',monospace;--world-text-size:20px;--world-line-height:1.3;--world-letter-spacing:0px;--world-radius:0px;--tag:12px;--small:14px}
/* Derived on body, where the look sets --w-* inline: a var() inside a custom property
 * is substituted where that property is declared, so these must live on body. */
body{--metal:color-mix(in srgb,var(--w-panel) 84%,var(--w-ink) 16%);--metal-dark:color-mix(in srgb,var(--w-panel) 78%,black);
--hi:color-mix(in srgb,var(--w-panel) 60%,white);--lo:color-mix(in srgb,var(--w-panel) 50%,black);--well:color-mix(in srgb,var(--w-bg) 86%,black)}
*{box-sizing:border-box}
html{min-height:100%;background:var(--w-bg)}
body{margin:0;min-height:100dvh;color:var(--w-ink);background:var(--w-bg);font:var(--world-text-size)/var(--world-line-height) var(--world-font);letter-spacing:var(--world-letter-spacing);accent-color:var(--w-accent2)}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
pre{margin:0;font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;tab-size:4}
svg,img{display:block}
.pixel-art{image-rendering:pixelated;shape-rendering:crispEdges}
:focus-visible{outline:2px solid var(--w-accent2);outline-offset:2px}
::selection{background:var(--w-accent);color:var(--w-ink)}

/* Frames: a raised bevel (light top-left, dark bottom-right) with a hairline inside. */
.bevel{background:var(--metal);border:3px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);border-radius:var(--world-radius);box-shadow:inset 0 0 0 1px var(--metal-dark),0 0 0 1px var(--w-bg)}
.sunken,.hud-side,.hud-turn,.raw-form,.note-input,.transcript,.viewport,input,select,textarea{background:var(--well);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);border-radius:var(--world-radius)}
.plate{display:flex;align-items:center;gap:10px;min-height:30px;padding:3px 8px 3px 10px;background:var(--metal-dark);border-bottom:2px solid var(--lo);border-radius:var(--world-radius) var(--world-radius) 0 0}
.plate-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--tag);letter-spacing:2px;text-transform:uppercase;color:var(--w-muted)}

/* Keys: bevelled buttons. */
.key{font:var(--small)/1.2 var(--world-font);letter-spacing:1px;text-transform:uppercase;color:var(--w-ink);background:var(--metal);border:3px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);border-radius:var(--world-radius);padding:7px 14px;cursor:pointer;white-space:nowrap}
.key.small{font-size:var(--tag);padding:4px 10px;border-width:2px}
.key.primary{background:color-mix(in srgb,var(--w-accent) 42%,var(--metal));min-width:150px}
.key:hover:not(:disabled),.key:focus-visible:not(:disabled){background:color-mix(in srgb,var(--w-accent) 28%,var(--metal));color:var(--w-accent2)}
.key:active:not(:disabled){border-color:var(--lo) var(--hi) var(--hi) var(--lo);transform:translateY(1px)}
.key:disabled{opacity:.45;cursor:default}

/* Fields. */
input,select,textarea{font:var(--world-text-size)/1.3 var(--world-font);letter-spacing:var(--world-letter-spacing);color:var(--w-ink);padding:7px 9px;width:100%;min-height:40px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--w-accent2)}
input:disabled,select:disabled,textarea:disabled{opacity:.55}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--w-muted) 50%),linear-gradient(135deg,var(--w-muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 10px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:30px}
select option{background:var(--well);color:var(--w-ink)}
input::placeholder{color:var(--w-muted);opacity:.7}
input[type="checkbox"]{width:16px;height:16px;min-height:0;margin:0;padding:0;accent-color:var(--w-accent2)}

/* Shell. */
.shell{max-width:1480px;margin:auto;padding:8px 10px 10px;height:100dvh;min-height:520px;display:flex;flex-direction:column;gap:8px}
.topbar{display:flex;align-items:center;gap:16px;height:54px;padding:0 10px 0 12px}
.brand{display:flex;align-items:center;gap:12px}
.brand-emblem{width:18px;height:22px;background:var(--w-accent);border:3px solid var(--lo);box-shadow:0 0 0 2px var(--w-accent2)}
.wordmark{font:34px/1 var(--world-font);letter-spacing:2px;color:var(--w-ink);text-shadow:2px 2px var(--metal-dark)}
.lamp{margin-left:auto;display:flex;align-items:center;gap:9px;min-height:30px;padding:2px 12px;font-size:var(--tag);letter-spacing:2px;text-transform:uppercase;color:var(--w-muted);background:var(--well);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);border-radius:var(--world-radius)}
.lamp-dot{width:8px;height:8px;background:var(--w-accent2);box-shadow:0 0 6px var(--w-accent2)}
.lamp[data-busy="true"] .lamp-dot{animation:busy-blink 1s steps(2,end) infinite}
.topbar-actions{display:flex;gap:8px}
.notice{padding:10px 14px;font-size:var(--small);line-height:1.5;color:var(--w-ink);background:color-mix(in srgb,var(--w-accent) 22%,var(--metal));white-space:pre-wrap}

/* Setup menu. */
.setup-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
.setup-grid{display:grid;grid-template-columns:1.2fr 1fr .7fr 1.5fr;gap:12px}
.field{display:block;min-width:0}
.field-label{display:block;margin-bottom:6px;font-size:var(--tag);letter-spacing:2px;text-transform:uppercase;color:var(--w-muted)}
.setup-footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:12px 22px}
.setup-footer .primary{margin-left:auto}
.check{display:flex;align-items:center;gap:8px;font-size:var(--small);color:var(--w-ink)}

/* Stage. */
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr);gap:8px;flex:1 1 0;min-height:0}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;padding:6px;gap:6px}
.viewport{position:relative;flex:1 1 0;min-height:170px;overflow:hidden;background:var(--w-sky);isolation:isolate}
.world-backdrop{position:absolute;inset:0;z-index:0;width:100%;height:100%;pointer-events:none}
.viewport::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 0 2px var(--w-bg),inset 0 0 40px color-mix(in srgb,var(--w-near) 45%,transparent)}
.idol{position:absolute;z-index:1;left:50%;bottom:3%;transform:translateX(-50%);width:clamp(120px,24%,230px);height:66%;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.idol svg{width:100%;height:100%;overflow:visible}
.idol.training-post{height:60%;width:clamp(100px,18%,170px)}
.title-card{position:absolute;z-index:3;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.title-word{font:76px/1 var(--world-font);letter-spacing:6px;color:var(--w-ink);padding:14px 30px 12px;background:color-mix(in srgb,var(--w-panel) 88%,transparent);border:4px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);text-shadow:3px 3px var(--metal-dark)}
.title-card p{padding:7px 16px;font-size:var(--tag);letter-spacing:2px;text-transform:uppercase;color:var(--w-ink);background:color-mix(in srgb,var(--w-panel) 90%,transparent);border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi)}
.dialogue{position:absolute;z-index:3;left:10px;top:10px;right:10px;max-height:58%;overflow:auto;padding:10px 14px 12px;color:var(--w-ink);background:color-mix(in srgb,var(--w-panel) 91%,transparent);border:3px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);border-radius:var(--world-radius);box-shadow:inset 0 0 0 1px var(--metal-dark);scrollbar-width:thin;scrollbar-color:var(--lo) transparent}
body[data-phase="pick"] .dialogue,body[data-phase="note"] .dialogue,body[data-phase="done"] .dialogue{top:50%;left:50%;right:auto;transform:translate(-50%,-50%);width:min(780px,94%);max-height:86%;padding:16px 22px 18px}
body[data-phase="done"] .dialogue{max-height:92%}

/* Status bar. */
.hud{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;padding:6px;background:var(--metal);border:3px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);border-radius:var(--world-radius);box-shadow:inset 0 0 0 1px var(--metal-dark)}
.hud.hud-raw{display:block}
.hud-side{display:flex;flex-direction:column;gap:5px;min-height:76px;padding:5px 9px 7px}
.hud-tag{font-size:var(--tag);letter-spacing:2px;text-transform:uppercase;color:var(--w-muted);line-height:1}
.hud-name{font-size:var(--small);line-height:1.1;letter-spacing:1px;color:var(--w-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slots{display:flex;flex-wrap:wrap;gap:4px 16px;min-height:calc(var(--world-text-size) * 1.1)}
.slot{font-size:var(--world-text-size);line-height:1.1;white-space:pre;color:var(--w-ink)}
.slots.transient .slot{color:var(--w-accent2)}
.hud-turn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:104px;padding:5px 14px}
.hud-turn-n{font-size:34px;line-height:1;color:var(--w-accent2);text-shadow:2px 2px var(--metal-dark)}
.hud-turn-left{font-size:var(--tag);letter-spacing:1px;color:var(--w-muted);white-space:nowrap}
.screen-original{padding:10px 12px;font-size:var(--world-text-size)}

/* Tray: hand, commands, console; options; notes. */
.tray{display:flex;flex-direction:column;gap:8px;padding:8px;background:var(--metal);border:3px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);border-radius:var(--world-radius);box-shadow:inset 0 0 0 1px var(--metal-dark)}
#actionInput{display:flex;flex-direction:column;gap:8px}
.hand{display:flex;align-items:stretch;gap:8px;padding:2px 2px 4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:var(--lo) transparent}
.hand:empty{display:none}
.choice{flex:0 0 118px;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;padding:9px 6px 8px;font:var(--world-text-size)/1.1 var(--world-font);letter-spacing:var(--world-letter-spacing);text-align:center;color:var(--w-ink);background:var(--well);border:3px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);border-radius:var(--world-radius);cursor:pointer;white-space:pre-wrap;overflow-wrap:anywhere}
.choice:hover:not(:disabled),.choice:focus-visible:not(:disabled){background:color-mix(in srgb,var(--w-accent) 30%,var(--well));border-color:var(--w-accent2)}
.choice:active:not(:disabled){transform:translateY(1px);border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
.choice:disabled{opacity:.5;cursor:default}
.card-art{width:50px;height:50px;flex:none;pointer-events:none}
.card-art svg{width:100%;height:100%}
.card-label{display:flex;flex-direction:column;align-items:center;gap:3px}
.card-name{color:var(--w-ink)}
.card-mark{color:var(--w-accent2)}
.hand.options{flex-wrap:wrap;overflow:visible}
.options .choice{flex:1 1 200px;min-height:54px;flex-direction:row;justify-content:center;padding:10px 14px}
.console{display:flex;align-items:center;gap:8px}
.commands{display:flex;flex-wrap:wrap;gap:6px}
.commands:empty{display:none}
.key.command{font-size:var(--small);padding:8px 16px;min-width:92px}
.raw-form{flex:1;display:flex;align-items:center;gap:8px;min-width:160px;padding:2px 4px 2px 10px}
.raw-form::before{content:">";color:var(--w-accent2);font-size:var(--world-text-size)}
.work-note{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.work-note[hidden]{display:none}
.work-note .note-input{min-height:3.2em;resize:vertical}
.raw-form input{flex:1;min-width:0;min-height:32px;padding:4px 2px;background:transparent;border:0;border-radius:0}
.raw-form input:focus{border:0}
.note-form{display:flex;flex-direction:column;gap:8px}
.note-input{display:block;min-height:112px;resize:vertical;padding:10px 12px;font-size:var(--world-text-size);line-height:1.45}
.note-actions{display:flex;justify-content:flex-end}
.waiting{height:60px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:var(--tag);letter-spacing:2px;text-transform:uppercase;color:var(--w-muted)}
.waiting::before{content:"";display:block;width:9px;height:14px;background:var(--w-accent2);animation:busy-blink .8s steps(2,end) infinite}

/* Record. */
.journal{display:flex;flex-direction:column;min-height:0}
.journal .plate{border-radius:0}
.transcript{flex:1;min-height:0;overflow:auto;padding:8px 10px 20px;border-width:0 0 0 0;border-radius:0;scrollbar-width:thin;scrollbar-color:var(--lo) transparent;outline-offset:-3px}
.transcript-item{padding:6px 0}
.transcript-item pre{font-size:calc(var(--world-text-size) - 4px);line-height:1.4;color:var(--w-muted)}
.transcript-item:last-child pre{color:var(--w-ink)}
.transcript hr{border:0;border-top:2px solid var(--lo);margin:8px 0}
.transcript-empty{padding:14px 0;font-size:var(--tag);letter-spacing:2px;text-transform:uppercase;color:var(--w-muted)}

@keyframes busy-blink{50%{opacity:.15}}
@media(min-width:1550px){.idol{height:70%}}
@media(max-width:1100px){.setup-grid{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:minmax(0,1fr) 260px}}
@media(max-width:850px){.shell{height:auto;min-height:100dvh}.workspace{grid-template-columns:1fr;grid-template-rows:minmax(560px,auto) 320px}.hud{grid-template-columns:1fr auto 1fr}.wordmark{font-size:28px}}
@media(max-width:520px){.setup-grid{grid-template-columns:1fr}.hud{grid-template-columns:1fr;grid-template-rows:auto auto auto}.hud-turn{flex-direction:row;gap:12px;min-height:44px}.idol{width:40%;height:58%}.title-word{font-size:48px;letter-spacing:3px}.topbar{gap:8px;padding:0 8px}.lamp{display:none}}
@media(prefers-reduced-motion:reduce){.lamp-dot,.waiting::before{animation:none}}

/* Frame construction per look. The frame index is independent of scene, palette and
 * type (look.js), so each rule here only shapes borders, radii and surface patterns
 * of the same frames: .bevel (top bar, setup, stage, record), .hud, .hud-side,
 * .hud-turn, .tray, .choice, .key, .dialogue, .plate. No rule adds text. */
body[data-frame="retro"] :is(.bevel,.hud,.tray,.choice){box-shadow:inset 0 0 0 1px var(--metal-dark),inset 0 0 0 3px color-mix(in srgb,var(--w-accent) 35%,transparent)}
body[data-frame="carved"] :is(.bevel,.hud,.tray,.choice,.dialogue){border-width:5px;border-style:ridge;border-color:var(--metal)}
body[data-frame="carved"] .plate{border-bottom:3px ridge var(--metal)}
body[data-frame="riveted"] :is(.bevel,.hud,.tray){border-width:4px;border-style:ridge;border-color:var(--metal);background-image:radial-gradient(circle at 7px 7px,var(--w-accent2) 0 1px,transparent 2px),radial-gradient(circle at calc(100% - 7px) 7px,var(--w-accent2) 0 1px,transparent 2px),radial-gradient(circle at 7px calc(100% - 7px),var(--w-accent2) 0 1px,transparent 2px),radial-gradient(circle at calc(100% - 7px) calc(100% - 7px),var(--w-accent2) 0 1px,transparent 2px)}
body[data-frame="riveted"] .plate{border-bottom:4px solid transparent;border-image:repeating-linear-gradient(135deg,var(--lo) 0 7px,var(--metal) 7px 14px) 4}
body[data-frame="terminal"] :is(.bevel,.hud,.tray,.choice,.hud-side,.hud-turn,.dialogue,.key){border-width:1px;border-color:var(--w-accent);box-shadow:inset 0 0 14px color-mix(in srgb,var(--w-accent) 8%,transparent),0 0 8px color-mix(in srgb,var(--w-accent) 10%,transparent)}
body[data-frame="terminal"] .plate{background-image:repeating-linear-gradient(0deg,transparent 0 3px,color-mix(in srgb,var(--w-accent) 6%,transparent) 3px 4px)}
body[data-frame="terminal"] .wordmark{letter-spacing:5px;color:var(--w-accent)}
body[data-frame="orbital"] :is(.bevel,.hud,.tray,.choice){border-width:4px;border-radius:14px 4px 14px 4px}
body[data-frame="orbital"] .plate{border-radius:11px 2px 0 0;border-bottom:2px solid var(--w-accent)}
body[data-frame="orbital"] .brand-emblem{border-radius:50%;background:var(--w-accent2)}
body[data-frame="neon"] :is(.bevel,.hud,.tray,.choice){border-width:1px;border-color:var(--w-accent2);box-shadow:inset 0 0 0 3px var(--w-bg),0 0 14px color-mix(in srgb,var(--w-accent) 18%,transparent)}
body[data-frame="neon"] .choice{border-left:4px solid var(--w-accent2);border-radius:0 12px 0 0}
body[data-frame="neon"] .wordmark{text-shadow:2px 0 var(--w-accent),-2px 0 var(--w-accent2)}
body[data-frame="deco"] :is(.bevel,.hud,.tray,.choice){border:4px double var(--w-accent2);box-shadow:inset 0 0 0 3px var(--metal),inset 0 0 0 4px var(--lo)}
body[data-frame="deco"] .plate{background:repeating-linear-gradient(90deg,var(--metal-dark) 0 12px,color-mix(in srgb,var(--w-accent2) 16%,var(--metal-dark)) 12px 14px)}
body[data-frame="deco"] .wordmark{letter-spacing:7px}
body[data-frame="cloth"] :is(.bevel,.hud,.tray,.choice){border:2px dashed var(--lo);box-shadow:inset 0 0 0 4px var(--metal)}
body[data-frame="cloth"] .plate{border-bottom:1px dashed var(--w-accent);background-image:repeating-linear-gradient(45deg,transparent 0 4px,color-mix(in srgb,var(--w-accent2) 6%,transparent) 4px 5px)}
body[data-frame="ink"] :is(.bevel,.hud,.tray,.choice){border-radius:2px 7px 4px 3px;border-width:2px 3px 4px 2px;border-color:var(--w-ink);box-shadow:2px 2px 0 var(--lo)}
body[data-frame="ink"] .plate{border-bottom:3px solid var(--w-ink)}
body[data-frame="gothic"] :is(.bevel,.hud,.tray){border:3px double var(--w-accent2);border-radius:18px 18px 3px 3px}
body[data-frame="gothic"] .plate{border-radius:15px 15px 0 0}
body[data-frame="gothic"] .choice{border-radius:35% 35% 3px 3px;border-top:3px double var(--w-accent2)}
body[data-frame="silhouette"] :is(.bevel,.hud,.tray,.choice,.hud-side,.hud-turn){border:1px solid var(--w-ink);box-shadow:0 0 18px #0005}
body[data-frame="silhouette"] .brand-emblem{box-shadow:none;background:var(--w-ink);border-color:var(--w-ink)}
body[data-frame="organic"] :is(.bevel,.hud,.tray){border:1px solid var(--w-accent);border-radius:16px 6px 16px 6px;box-shadow:0 0 18px color-mix(in srgb,var(--w-accent2) 8%,transparent)}
body[data-frame="organic"] .plate{border-radius:14px 4px 0 0}
body[data-frame="organic"] .choice{border-radius:22px 6px 22px 6px;border-bottom:3px solid var(--w-accent)}
body[data-frame="organic"] .wordmark{letter-spacing:5px}
body[data-frame="rust"] :is(.bevel,.hud,.tray,.choice){border:3px solid var(--lo);border-image:linear-gradient(125deg,var(--w-accent2),var(--w-muted),var(--w-ground),var(--w-accent2)) 1}
body[data-frame="rust"] .plate{background:repeating-linear-gradient(100deg,var(--metal-dark) 0 19px,color-mix(in srgb,var(--w-accent2) 10%,var(--metal-dark)) 19px 21px)}
body[data-frame="paint"] :is(.bevel,.hud,.tray,.choice){border:3px solid var(--lo);border-image:linear-gradient(12deg,var(--w-accent),var(--lo) 20%,var(--w-accent2) 74%,var(--lo)) 1}
body[data-frame="paint"] .plate{border-bottom:3px solid var(--w-accent)}
body[data-frame="paint"] .choice{box-shadow:3px 3px 0 var(--lo)}
body[data-frame="relic"] :is(.bevel,.hud,.tray,.choice){border:5px ridge var(--metal);box-shadow:inset 0 0 0 1px var(--w-accent2)}
body[data-frame="relic"] .plate{border-bottom:3px double var(--w-accent2)}
body[data-frame="relic"] .brand-emblem{transform:rotate(45deg);width:16px;height:16px}
body[data-frame="greek"] :is(.bevel,.hud,.tray){border:5px double var(--w-accent2)}
body[data-frame="greek"] .plate{border-bottom:3px solid var(--w-accent2);background:repeating-linear-gradient(90deg,var(--metal-dark) 0 20px,color-mix(in srgb,var(--w-accent2) 12%,var(--metal-dark)) 20px 24px)}
body[data-frame="greek"] .choice{border-radius:2px 12px 2px 12px;border-bottom:4px solid var(--w-accent2)}
body[data-frame="sketch"] :is(.bevel,.hud,.tray,.choice){border:2px solid var(--w-ink);border-radius:6px 2px 7px 3px;outline:1px solid var(--lo);outline-offset:-5px;box-shadow:2px 3px 0 var(--lo)}
body[data-frame="sketch"] .plate{background:repeating-linear-gradient(15deg,var(--metal-dark) 0 7px,color-mix(in srgb,var(--w-ink) 10%,var(--metal-dark)) 7px 8px)}

          <label class="field"><span class="field-label">Carried into the next life</span><select id="carry" name="carry"><option value="notes">Your own notes</option><option value="log">The full record of the previous life</option><option value="both">Both</option><option value="none">Nothing</option></select></label>

      <aside class="journal bevel" aria-labelledby="transcriptTitle">

      </aside>
    </main>

        // Re-running existing lives is an explicit choice for this start only.
        $('restart').checked = false;
        try { sessionStorage.removeItem(draftKey); } catch (_) { /* Storage is optional. */ }
        $('transcript').replaceChildren($('transcriptEmpty')); $('transcriptEmpty').hidden = false; $('transcriptEmpty').textContent = 'Waiting for the first screen';
        showDialogue(''); $('hud').hidden = true; $('hud').replaceChildren(); $('idol').hidden = true;
        document.body.dataset.phase = 'idle'; $('empty').hidden = false; $('emptyText').textContent = 'Starting'; $('inputArea').hidden = true; setSetup(false);
      } catch (error) { message(unreachable(error) ? 'Cannot reach the service. Try again in a moment.' : error.message); }
      finally { session.busy = false; session.starting = false; controls(); }
    });
    $('stop').addEventListener('click', async () => {
      if (session.busy || !running()) return;
      session.busy = true; controls(); message('');
      try { await request('/api/stop', {}); }
      catch (error) { message(unreachable(error) ? 'Cannot reach the service. Try again in a moment.' : error.message); }
      finally { session.busy = false; controls(); }
    });
    $('export').addEventListener('click', async () => {
      if (session.busy) return; session.busy = true; controls(); message('');
      try { const data = await request('/api/export', {name:running() ? session.name : $('name').value || session.name}); message(data.message || 'Exported'); }
      catch (error) { message(unreachable(error) ? 'Cannot reach the service. Try again in a moment.' : error.message); }
      finally { session.busy = false; controls(); }
    });
    $('rawForm').addEventListener('submit', event => { event.preventDefault(); submit($('rawInput').value); });
    $('noteForm').addEventListener('submit', event => { event.preventDefault(); submit($('noteInput').value); });
    $('rawInput').addEventListener('input', saveDraft); $('noteInput').addEventListener('input', saveDraft);
    $('name').addEventListener('input', controls);
    $('pack').addEventListener('change', () => { if (!running()) { $('lives').value = defaultLives(); applyLook(); } });
    $('lives').addEventListener('input', () => { if (!running()) applyLook(); });
    $('toggleSetup').addEventListener('click', () => setSetup($('setupBody').hidden));
    $('scrollLatest').addEventListener('click', () => { $('transcript').scrollTop = $('transcript').scrollHeight; });
    applyLook(); controls(); poll();
  </script>
</body>
</html>
